<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#569cd6"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f14c4c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#1e1e1e"/>

  <!-- ── Claude Code (top) ───────────────────────────────────────── -->
  <rect x="30" y="20" width="900" height="80" rx="8" fill="#252526" stroke="#3a6ea5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="47" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#d4d4d4">Claude Code</text>
  <text x="480" y="65" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" fill="#9cdcfe">ask_deepseek · run_deepseek_task</text>
  <text x="480" y="82" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">MCP tool calls via stdin/stdout  ·  configured in ~/.claude.json</text>

  <!-- stdin/stdout arrow: Claude Code → MCP Server -->
  <line x1="240" y1="100" x2="240" y2="146" stroke="#569cd6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="248" y="122" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">stdin/stdout</text>
  <text x="248" y="136" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">(MCP protocol)</text>

  <!-- ── MCP Server (left column) ───────────────────────────────── -->
  <rect x="30" y="150" width="420" height="325" rx="8" fill="#252526" stroke="#6a3a9a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="174" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#d4d4d4">MCP Server · server.ts</text>

  <!-- Sub: DeepSeek Agent Loop -->
  <rect x="50" y="184" width="380" height="68" rx="5" fill="#2a2a2a" stroke="#6a3a9a" stroke-width="1"/>
  <text x="240" y="204" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#c586c0">DeepSeek Agent Loop</text>
  <text x="240" y="221" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">↕ DeepSeek API (HTTPS)  ·  max 30 iterations</text>
  <text x="240" y="238" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">32 MB session budget  ·  AbortController kill poll (500 ms)</text>

  <!-- Sub: File Tools -->
  <rect x="50" y="264" width="380" height="78" rx="5" fill="#2a2a2a" stroke="#6a3a9a" stroke-width="1"/>
  <text x="240" y="284" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#4ec9b0">File Tools</text>
  <text x="240" y="301" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">list_directory · read_file · write_file</text>
  <text x="240" y="317" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">run_command <tspan fill="#f14c4c" font-weight="600">(requires approval popup)</tspan></text>
  <text x="240" y="333" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">posture: read-only · create-only · edit</text>

  <!-- Sub: Workspace Jail -->
  <rect x="50" y="354" width="380" height="65" rx="5" fill="#2a2a2a" stroke="#6a3a9a" stroke-width="1"/>
  <text x="240" y="374" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#dcdcaa">Workspace Jail · jail.ts</text>
  <text x="240" y="391" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">path containment · symlink escape prevention</text>
  <text x="240" y="407" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">sensitive file denylist · 16 blocked patterns</text>

  <!-- Kill file box (bottom-left) -->
  <rect x="50" y="500" width="240" height="70" rx="8" fill="#252526" stroke="#8b1a1a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="522" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#f14c4c">~/.claude/deepseek-kill</text>
  <text x="170" y="539" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">Kill file written by Stop button</text>
  <text x="170" y="556" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">polled every 500 ms · aborts API call</text>

  <!-- Kill file → MCP Server arrow (red) -->
  <line x1="170" y1="500" x2="170" y2="477" stroke="#f14c4c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="178" y="492" font-family="Segoe UI,sans-serif" font-size="10" fill="#f14c4c">Stop signal</text>

  <!-- ── Extension Host (right column) ──────────────────────────── -->
  <rect x="510" y="150" width="420" height="320" rx="8" fill="#252526" stroke="#1e6a6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="174" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#d4d4d4">Extension Host · extension.ts</text>

  <!-- Sub: HTTP Approval Server -->
  <rect x="530" y="184" width="380" height="90" rx="5" fill="#2a2a2a" stroke="#1e6a6a" stroke-width="1"/>
  <text x="720" y="204" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#4ec9b0">HTTP Approval Server</text>
  <text x="720" y="221" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">127.0.0.1:&lt;dynamic port&gt;</text>
  <text x="720" y="237" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">POST /approve · /running · /event</text>
  <text x="720" y="253" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">port written to ~/.claude/deepseek-bridge-port</text>
  <text x="720" y="266" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">session-approved prefix cache (in-memory)</text>

  <!-- Internal postMessage arrow -->
  <line x1="720" y1="274" x2="720" y2="289" stroke="#569cd6" stroke-width="1" marker-end="url(#ab)"/>
  <text x="728" y="285" font-family="Segoe UI,sans-serif" font-size="9" fill="#6a9955">postMessage (webview API)</text>

  <!-- Sub: Sidebar Webview -->
  <rect x="530" y="292" width="380" height="158" rx="5" fill="#2a2a2a" stroke="#1e6a6a" stroke-width="1"/>
  <text x="720" y="312" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#4ec9b0">Sidebar Webview</text>
  <text x="720" y="329" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">Config tab · Cost History tab · Console tab (live output)</text>
  <text x="720" y="345" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">Command Approval Cards — Once / Session / Always</text>
  <text x="720" y="361" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">PATH-validated scope options · pencil edit</text>
  <text x="720" y="377" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">Full Permissions toggle · Workspace enable/disable</text>
  <text x="720" y="393" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#f14c4c">⬛ Stop button → writes kill file · dismisses approval popup</text>
  <text x="720" y="416" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">persistent: ~/.claude/deepseek-allowlist.json</text>
  <text x="720" y="432" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="10" fill="#6a9955">history: ~/.claude/deepseek-history.json</text>

  <!-- ── Cross-column arrows (MCP ↔ Extension) ──────────────────── -->

  <!-- POST /approve → -->
  <line x1="452" y1="222" x2="528" y2="222" stroke="#569cd6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="456" y="216" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">POST /approve</text>

  <!-- ← allow / deny (dashed) -->
  <line x1="528" y1="238" x2="452" y2="238" stroke="#569cd6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ab)"/>
  <text x="455" y="252" font-family="Segoe UI,sans-serif" font-size="10" fill="#9cdcfe">allow / deny + scope</text>

  <!-- POST /running → (thin) -->
  <line x1="452" y1="268" x2="528" y2="268" stroke="#569cd6" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#ab)"/>
  <text x="453" y="263" font-family="Segoe UI,sans-serif" font-size="9" fill="#6a9955">POST /running</text>

  <!-- POST /event → (thin) -->
  <line x1="452" y1="282" x2="528" y2="282" stroke="#569cd6" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#ab)"/>
  <text x="453" y="296" font-family="Segoe UI,sans-serif" font-size="9" fill="#6a9955">POST /event  (console stream)</text>

</svg>
